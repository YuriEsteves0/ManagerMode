spring.application.name=manager-api

# Conexao com o MySQL - banco ja deve existir e estar populado a partir do manager.sql
spring.datasource.url=jdbc:mysql://localhost:3306/manager?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forca o Spring Boot a NAO usar banco em memoria (H2) por engano
spring.test.database.replace=none

# Valida se as entidades batem com o schema ja existente
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Forca o Hibernate a interpretar booleanos como TINYINT no MySQL
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha